    <script>(function(){var d=document.documentElement;try{var K="yozgo-theme",s=localStorage.getItem(K);if(s===null){var o=localStorage.getItem("yozgo-ui-theme");if(o==="light"||o==="dark"){s=o;localStorage.setItem(K,s);}}if(s==="system"||s===null){s=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";}if(s!=="light"&&s!=="dark")s="dark";d.classList.add(s);d.style.colorScheme=s;}catch(e){d.classList.add("dark");d.style.colorScheme="dark";}})();</script>
